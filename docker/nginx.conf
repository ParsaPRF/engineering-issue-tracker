# Nginx configuration for the single-origin topology.
#
# Why one origin matters here: authentication is cookie-based (ADR-003). Serving the SPA and the API
# from the same host means the session cookie is same-site, no CORS preflight is needed for normal
# use, and CSRF behaves exactly as the Django defaults expect.

upstream backend_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Attachments are capped at 10 MB in Django; leave headroom for multipart overhead.
    client_max_body_size 12m;

    # Do not advertise the exact Nginx version.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API and admin -------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://backend_api;
        access_log off;
    }

    # --- Backend-generated static files (Django admin, DRF docs) -------------
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # --- Public media (avatars etc). Attachments are NOT served from here: ---
    # they are streamed by the authorising download endpoint (ADR-010).
    location /media/ {
        alias /media/;
        access_log off;
        add_header Cache-Control "private, max-age=0";
    }

    # --- SPA ----------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Client-side routing: unknown paths render the app and let the router decide.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}