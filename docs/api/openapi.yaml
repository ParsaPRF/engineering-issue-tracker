components:
  schemas:
    AssignTicketRequest:
      type: object
      description: '``POST /tickets/<id>/assign/`` payload. ``assignee: null`` unassigns.'
      properties:
        assignee:
          type: string
          format: uuid
          nullable: true
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ticket:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        comment:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        uploader:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        original_name:
          type: string
          readOnly: true
          title: Original file name
        content_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
          title: Size (bytes)
        sha256:
          type: string
          readOnly: true
          title: Sha256 checksum
        download_url:
          type: string
          description: 'Relative API path, not a storage URL: the request still has
            to be authorised.'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - comment
      - content_type
      - created_at
      - download_url
      - id
      - original_name
      - sha256
      - size_bytes
      - ticket
      - uploader
    AuditEvent:
      type: object
      description: Read-only projection of an audit event.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Null when the system acted or the account was removed; the
            event survives.
        actor_email:
          type: string
          format: email
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        object_type:
          type: string
          readOnly: true
          description: Django label of the affected object, e.g. tickets.ticket.
        object_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        project:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        project_key:
          type: string
          readOnly: true
        ticket:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        ticket_key:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_email
      - actor_name
      - created_at
      - id
      - ip_address
      - metadata
      - object_id
      - object_type
      - project
      - project_key
      - ticket
      - ticket_key
      - user_agent
    Comment:
      type: object
      description: Read representation of a comment.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ticket:
          type: string
          format: uuid
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        body:
          type: string
          readOnly: true
        is_deleted:
          type: boolean
          readOnly: true
          title: Deleted
          description: 'Soft deletion: the row is retained so history stays traceable.'
        is_edited:
          type: boolean
          readOnly: true
        edited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set when the author edits the body.
        attachment_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachment_count
      - author
      - body
      - created_at
      - edited_at
      - id
      - is_deleted
      - is_edited
      - ticket
      - updated_at
    CommentCreateRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
      required:
      - body
    Component:
      type: object
      description: Read representation of a component.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        lead:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - is_active
      - lead
      - name
      - project
      - updated_at
    ComponentRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    Label:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        color:
          type: string
          readOnly: true
          description: Hex colour used by the UI badge.
      required:
      - color
      - id
      - name
    LoginRequest:
      type: object
      description: |-
        Input for session login.

        Credential *checking* happens in ``services.auth.session_login`` because it needs the request
        to create a session; this serializer only guarantees the fields are present and well-formed.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    MeUpdate:
      type: object
      description: 'PATCH /auth/me/ payload: ``full_name`` and/or nested ``profile``
        fields.'
      properties:
        full_name:
          type: string
          maxLength: 150
        profile:
          $ref: '#/components/schemas/ProfileUpdate'
    MeUpdateRequest:
      type: object
      description: 'PATCH /auth/me/ payload: ``full_name`` and/or nested ``profile``
        fields.'
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        profile:
          $ref: '#/components/schemas/ProfileUpdateRequest'
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/NotificationEventEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Who caused the event. Null when the system acted.
        actor_name:
          type: string
          readOnly: true
        ticket:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        ticket_key:
          type: string
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        project_key:
          type: string
          readOnly: true
        payload:
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
          title: Read
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_sent:
          type: boolean
          readOnly: true
          title: Dispatched
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - actor_name
      - body
      - created_at
      - event_type
      - id
      - is_read
      - is_sent
      - payload
      - project
      - project_key
      - read_at
      - ticket
      - ticket_key
      - title
    NotificationEventEnum:
      enum:
      - ticket.created
      - ticket.assigned
      - ticket.reassigned
      - ticket.status_changed
      - ticket.resolved
      - ticket.reopened
      - comment.added
      - membership.added
      type: string
      description: |-
        * `ticket.created` - Ticket created
        * `ticket.assigned` - Ticket assigned
        * `ticket.reassigned` - Ticket reassigned
        * `ticket.status_changed` - Ticket status changed
        * `ticket.resolved` - Ticket resolved
        * `ticket.reopened` - Ticket reopened
        * `comment.added` - Comment added
        * `membership.added` - Added to a project
