openapi: 3.0.3
info:
  title: Engineering Issue & Ticket Tracking System API
  version: 1.0.0
  description: Versioned REST API for projects, tickets, the ticket workflow, collaboration,
    notifications, audit and reporting. Authentication is session-based; obtain the
    `csrftoken` cookie from `/api/v1/auth/csrf/` and send it as the `X-CSRFToken`
    header on unsafe requests.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Set the CSRF cookie required by session-authenticated writes.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: CSRF cookie set.
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create an account with the least-privileged system role (REPORTER).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Validation error.
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        ``POST /api/v1/auth/login/`` — start a session.

        CSRF-protected on purpose (see ``RegisterView``): without it, an attacker could log a victim
        into an account the attacker controls and observe what the victim does next.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Invalid credentials.
        '403':
          description: Account inactive.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: '``POST /api/v1/auth/logout/`` — end the session.'
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Session ended.
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        ``GET``/``PATCH /api/v1/auth/me/`` — the caller's own account and profile.

        ``system_role`` and ``is_active`` are absent from the update serializer, so a user cannot
        promote themselves or reactivate their own disabled account (FR-1.5).
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      description: |-
        ``GET``/``PATCH /api/v1/auth/me/`` — the caller's own account and profile.

        ``system_role`` and ``is_active`` are absent from the update serializer, so a user cannot
        promote themselves or reactivate their own disabled account (FR-1.5).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeUpdate'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: |-
        ``GET``/``PATCH /api/v1/auth/me/`` — the caller's own account and profile.

        ``system_role`` and ``is_active`` are absent from the update serializer, so a user cannot
        promote themselves or reactivate their own disabled account (FR-1.5).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/me/password/:
    post:
      operationId: auth_me_password_create
      description: |-
        ``POST /api/v1/auth/me/password/`` — self-service password change.

        Changing a password invalidates other sessions, which is what users expect after a suspected
        compromise; the current session is re-established so the caller is not logged out of the tab
        they are using.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Password changed.
  /api/v1/auth/users/:
    get:
      operationId: auth_users_list
      description: |-
        Administrator user management under ``/api/v1/auth/users/``.

        Read-only as a viewset plus explicit ``@action`` methods, instead of a full ``ModelViewSet``:
        creating users through the admin API would need a different payload (invitations, initial
        password policy) and deleting them is not part of the lifecycle at all (UC-17).
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: system_role
        schema:
          type: string
          enum:
          - ADMIN
          - ENGINEER
          - PROJECT_MANAGER
          - REPORTER
        description: |-
          Global capability. Project access is granted separately by membership.

          * `REPORTER` - Reporter
          * `ENGINEER` - Engineer
          * `PROJECT_MANAGER` - Project Manager
          * `ADMIN` - Administrator
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/v1/auth/users/directory/:
    get:
      operationId: auth_users_directory_list
      description: |-
        People search used when adding project members (FR-2.5).

        Open to Admins and Project Managers — the roles that manage membership — and bounded to 20
        results. Engineers and Reporters do not get a browsable directory: least privilege, and an
        unbounded user list is an enumeration target.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: system_role
        schema:
          type: string
          enum:
          - ADMIN
          - ENGINEER
          - PROJECT_MANAGER
          - REPORTER
        description: |-
          Global capability. Project access is granted separately by membership.

          * `REPORTER` - Reporter
          * `ENGINEER` - Engineer
          * `PROJECT_MANAGER` - Project Manager
          * `ADMIN` - Administrator
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserSummaryList'
          description: ''
  /api/v1/auth/users/{id}/:
    get:
      operationId: auth_users_retrieve
      description: |-
        Administrator user management under ``/api/v1/auth/users/``.

        Read-only as a viewset plus explicit ``@action`` methods, instead of a full ``ModelViewSet``:
