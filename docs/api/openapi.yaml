        ``PATCH /tickets/<id>/`` payload.

        Every field is optional; the *service* decides which of them this actor may actually change, so
        the error says "you cannot edit this field" rather than "unknown field".
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/TicketTypeEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        component:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        labels:
          type: array
          items:
            type: string
            format: uuid
    PriorityEnum:
      enum:
      - LOWEST
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      type: string
      description: |-
        * `LOWEST` - Lowest
        * `LOW` - Low
        * `MEDIUM` - Medium
        * `HIGH` - High
        * `CRITICAL` - Critical
    ProfileUpdate:
      type: object
      description: Writable subset of the profile.
      properties:
        job_title:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 32
        timezone:
          type: string
          title: Time zone
          description: IANA name, e.g. Europe/Berlin. Used to render times for this
            user.
          maxLength: 64
        notify_on_assignment:
          type: boolean
        notify_on_comment:
          type: boolean
        notify_on_status_change:
          type: boolean
    ProfileUpdateRequest:
      type: object
      description: Writable subset of the profile.
      properties:
        job_title:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 32
        timezone:
          type: string
          minLength: 1
          title: Time zone
          description: IANA name, e.g. Europe/Berlin. Used to render times for this
            user.
          maxLength: 64
        notify_on_assignment:
          type: boolean
        notify_on_comment:
          type: boolean
        notify_on_status_change:
          type: boolean
    Project:
      type: object
      description: Read representation of a project.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          readOnly: true
          description: Short uppercase prefix for ticket keys, e.g. ENG.
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ProjectStatusEnum'
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        member_count:
          type: integer
          nullable: true
          readOnly: true
        ticket_count:
          type: integer
          nullable: true
          readOnly: true
        open_ticket_count:
          type: integer
          nullable: true
          readOnly: true
      required:
      - archived_at
      - created_at
      - description
      - id
      - key
      - member_count
      - name
      - open_ticket_count
      - owner
      - status
      - ticket_count
      - updated_at
    ProjectCreateRequest:
      type: object
      description: |-
        ``POST /projects/`` payload.

        Note the (deliberate) absence of ``validators=[project_key_validator]`` on the field: DRF runs
        field validators *before* ``validate_key``, so a validator here would reject ``"eng"`` before the
        method had a chance to upper-case it. Normalisation first, then validation — the ordering bug
        this comment exists to prevent from coming back.
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 10
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          default: ''
      required:
      - key
      - name
    ProjectMembership:
      type: object
      description: Read representation of a membership row.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/ProjectRoleEnum'
          readOnly: true
          title: Project role
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Deactivate to remove access while keeping the historical record.
        joined_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - joined_at
      - role
      - user
      - user_email
      - user_name
    ProjectRef:
      type: object
      description: Minimal project projection embedded in ticket payloads.
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
      required:
      - id
      - key
      - name
    ProjectRoleEnum:
      enum:
      - REPORTER
      - ENGINEER
      - MANAGER
      type: string
      description: |-
        * `REPORTER` - Reporter
        * `ENGINEER` - Engineer
        * `MANAGER` - Project Manager
    ProjectStatusEnum:
      enum:
      - ACTIVE
      - ARCHIVED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `ARCHIVED` - Archived
    RegisterRequest:
      type: object
      description: Input for public registration (FR-1.1).
      properties:
        email:
          type: string
          format: email
          minLength: 1
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - full_name
      - password
      - password_confirm
    SeverityEnum:
      enum:
      - TRIVIAL
      - MINOR
      - MAJOR
      - CRITICAL
      - BLOCKER
      type: string
      description: |-
        * `TRIVIAL` - Trivial
        * `MINOR` - Minor
        * `MAJOR` - Major
        * `CRITICAL` - Critical
        * `BLOCKER` - Blocker
    StatusHistory:
