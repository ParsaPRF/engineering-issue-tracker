  /api/v1/projects/:
    get:
      operationId: projects_list
      description: |-
        ``/api/v1/projects/`` — list, create, retrieve, update, archive, members, components, stats.

        Built from explicit mixins rather than ``ModelViewSet``: there is no ``update`` (replaced by a
        validated ``partial_update``) and no ``destroy`` at all, because projects are archived, never
        deleted (FR-2.4).
      parameters:
      - in: query
        name: key
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        description: |-
          * `ACTIVE` - Active
          * `ARCHIVED` - Archived
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
