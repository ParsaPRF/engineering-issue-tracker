      - severity
      - status
      - title
      - type
      - updated_at
    TicketStatusChoice:
      type: object
      description: 'Read-only helper for docs: the status enumeration.'
      properties:
        value:
          type: string
        label:
          type: string
      required:
      - label
      - value
    TicketStatusEnum:
      enum:
      - NEW
      - TRIAGED
      - IN_PROGRESS
      - IN_REVIEW
      - RESOLVED
      - CLOSED
      - REOPENED
      - BLOCKED
      - REJECTED
      - DUPLICATE
      type: string
      description: |-
        * `NEW` - New
        * `TRIAGED` - Triaged
        * `IN_PROGRESS` - In progress
        * `IN_REVIEW` - In review
        * `RESOLVED` - Resolved
        * `CLOSED` - Closed
        * `REOPENED` - Reopened
        * `BLOCKED` - Blocked
        * `REJECTED` - Rejected
        * `DUPLICATE` - Duplicate
    TicketTypeEnum:
      enum:
      - BUG
      - TASK
      - FEATURE
      - CHANGE_REQUEST
      - SUPPORT
      type: string
      description: |-
        * `BUG` - Bug
        * `TASK` - Task
        * `FEATURE` - Feature
        * `CHANGE_REQUEST` - Change request
        * `SUPPORT` - Support request
    TransitionInputRequest:
      type: object
      description: |-
        Payload for a status change.

        ``to_status`` is validated as a plain string here and against the state machine in the service:
        the serializer cannot know the ticket's current status, so it cannot know which moves are legal.
      properties:
        to_status:
          type: string
          minLength: 1
          maxLength: 20
        comment:
          type: string
          default: ''
      required:
      - to_status
    User:
      type: object
      description: Full read representation of a user, including the caller's memberships
        when relevant.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
          description: Login identifier. Stored lower-cased.
        full_name:
          type: string
          readOnly: true
        system_role:
          allOf:
          - $ref: '#/components/schemas/SystemRoleEnum'
          readOnly: true
          description: |-
            Global capability. Project access is granted separately by membership.

            * `REPORTER` - Reporter
            * `ENGINEER` - Engineer
            * `PROJECT_MANAGER` - Project Manager
            * `ADMIN` - Administrator
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Deactivate instead of deleting so history stays attributable.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          readOnly: true
        memberships:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - is_active
      - memberships
      - profile
      - system_role
    UserProfile:
      type: object
      description: Read representation of the profile.
      properties:
        job_title:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
          title: Time zone
          description: IANA name, e.g. Europe/Berlin. Used to render times for this
            user.
        avatar_key:
          type: string
          readOnly: true
          title: Avatar storage key
          description: Object key in private storage. Never a public URL (ADR-010).
        notify_on_assignment:
          type: boolean
          readOnly: true
        notify_on_comment:
          type: boolean
          readOnly: true
        notify_on_status_change:
          type: boolean
          readOnly: true
      required:
      - avatar_key
      - job_title
      - notify_on_assignment
      - notify_on_comment
      - notify_on_status_change
      - phone
      - timezone
    UserSummary:
      type: object
      description: Directory-safe projection used by member pickers (`PUBLIC_USER_FIELDS`).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
          description: Login identifier. Stored lower-cased.
        full_name:
          type: string
          readOnly: true
        system_role:
          allOf:
          - $ref: '#/components/schemas/SystemRoleEnum'
          readOnly: true
          description: |-
            Global capability. Project access is granted separately by membership.

            * `REPORTER` - Reporter
            * `ENGINEER` - Engineer
            * `PROJECT_MANAGER` - Project Manager
            * `ADMIN` - Administrator
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Deactivate instead of deleting so history stays attributable.
      required:
      - email
      - full_name
      - id
      - is_active
      - system_role
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
