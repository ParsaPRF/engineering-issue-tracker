          format: uuid
          nullable: true
        assignee:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        labels:
          type: array
          items:
            type: string
            format: uuid
      required:
      - description
      - project
      - title
    TicketList:
      type: object
      description: Lean representation for tables.
      properties:
