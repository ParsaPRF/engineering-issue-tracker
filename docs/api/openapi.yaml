          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TicketTypeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
          description: |-
            Changed only through the transition endpoint (ADR-005).

            * `NEW` - New
            * `TRIAGED` - Triaged
            * `IN_PROGRESS` - In progress
            * `IN_REVIEW` - In review
            * `RESOLVED` - Resolved
            * `CLOSED` - Closed
            * `REOPENED` - Reopened
            * `BLOCKED` - Blocked
            * `REJECTED` - Rejected
            * `DUPLICATE` - Duplicate
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          readOnly: true
          description: |-
            How soon this should be addressed.

            * `LOWEST` - Lowest
            * `LOW` - Low
            * `MEDIUM` - Medium
            * `HIGH` - High
            * `CRITICAL` - Critical
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
          description: |-
            How serious the technical impact is.

            * `TRIVIAL` - Trivial
            * `MINOR` - Minor
            * `MAJOR` - Major
            * `CRITICAL` - Critical
            * `BLOCKER` - Blocker
        reporter:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        assignee:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        is_overdue:
          type: boolean
          readOnly: true
        comment_count:
          type: integer
          readOnly: true
        attachment_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
