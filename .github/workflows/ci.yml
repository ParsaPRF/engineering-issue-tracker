# Continuous integration.
#
# What this workflow is *for* (and why each job exists):
#
#   1. `lint`          — fast failures: style, a schema that no longer generates cleanly, or a model
#                        change without its migration. These catch most integration mistakes in
#                        under a minute.
#   2. `backend-tests` — the suite runs against **real PostgreSQL 17**, not SQLite. That is
#                        deliberate: the concurrency test for ticket-key allocation is skipped on
#                        SQLite, and a test that is never executed is indistinguishable from a
#                        deleted one. This job is what closes that gap (see ADR-008).
#   3. `frontend`      — TypeScript must compile and the production bundle must build.
#   4. `docker`        — both Dockerfiles must actually build. The deployment guide claims they
#                        work; this job is the evidence, and it catches the classic "the image needs
#                        a file that .dockerignore excluded" failure.
#
# `docker compose up` is intentionally **not** run here: it needs real secrets and would test the
# environment more than the code. The compose file is validated by `docker compose config` in a
# step below, and the full stack is exercised by the deployment checklist.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run: CI minutes are a budget.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # Fast static checks
  # ---------------------------------------------------------------------------
  lint:
    name: Lint, schema, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Ruff (lint + import order)
        run: ruff check apps common config tests

      - name: No model change without its migration
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: OpenAPI schema generates with zero warnings
        run: python manage.py spectacular --fail-on-warn --file /tmp/openapi.yaml

  # ---------------------------------------------------------------------------
  # The real test suite, against PostgreSQL
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eng_tracker
          POSTGRES_USER: eng_tracker
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without the healthcheck the first test can race the server's startup and fail with a
        # connection error that looks like a code bug.
        options: >-
          --health-cmd "pg_isready -U eng_tracker -d eng_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_ENGINE: postgres
      POSTGRES_DB: eng_tracker
      POSTGRES_USER: eng_tracker
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Verify the database backend is PostgreSQL (not the SQLite fallback)
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.test")
          import django
          django.setup()
          from django.db import connection
          print("vendor:", connection.vendor)
          assert connection.vendor == "postgresql", "CI must exercise PostgreSQL, not SQLite"
          PY

      - name: Test suite (includes the PostgreSQL-only concurrency test)
        # ``pipefail`` matters: without it, piping pytest into tee would report tee's exit code and
        # a failing suite would show up as a green job. This is the single most common way a CI
        # pipeline lies.
        run: |
          set -o pipefail
          pytest -q --no-header -ra | tee /tmp/pytest-summary.txt

      - name: Fail if any test was skipped
        # A skip in the PostgreSQL job means the concurrency guarantee was not verified — exactly the
        # situation this job exists to prevent.
        run: |
          if grep -q "^SKIPPED" /tmp/pytest-summary.txt; then
            echo "::error::Tests were skipped in the PostgreSQL job; see the summary above."
            cat /tmp/pytest-summary.txt
            exit 1
          fi
          echo "no skipped tests"

  # ---------------------------------------------------------------------------
  # Frontend build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Reads ``packageManager`` when ``version`` is omitted, but only from the repository root — and our
      # package.json lives in frontend/, hence the explicit pin (it is the same version the lockfile
      # was produced with; a mismatched major can reject the lockfile).
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (lockfile is authoritative)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Report bundle size
        run: |
          du -sh dist
          find dist -type f \( -name '*.js' -o -name '*.css' \) -exec ls -lh {} +

  # ---------------------------------------------------------------------------
  # The whole stack, exactly as a developer would run it
  # ---------------------------------------------------------------------------
  compose-stack:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file (no daemon required)
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Prepare a real .env (production settings reject placeholder secrets)
        run: |
          python3 - <<'PY'
          import pathlib, secrets
          path = pathlib.Path(".env")
          text = path.read_text()
          text = text.replace(
              "DJANGO_SECRET_KEY=change-me-to-a-50-char-random-string",
              "DJANGO_SECRET_KEY=" + secrets.token_urlsafe(48),
          )
          text = text.replace("POSTGRES_PASSWORD=change-me", "POSTGRES_PASSWORD=ci-postgres-password")
          text = text.replace("AWS_SECRET_ACCESS_KEY=change-me", "AWS_SECRET_ACCESS_KEY=ci-s3-secret")
          path.write_text(text)
          PY

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if docker compose ps backend --format json | grep -q '"Health":"healthy"'; then
              echo "backend is healthy"; exit 0
            fi
            sleep 3
          done
          docker compose logs backend | tail -50
          echo "::error::the API container never became healthy"
          exit 1

      - name: Migrate and seed demo data
        run: |
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py seed_demo

      - name: Verify the stack end to end (Nginx -> API -> PostgreSQL, S3 round trip, security checks)
        run: bash scripts/verify_stack.sh

      - name: The worker must have consumed a notification task from Redis
        run: |
          if docker compose logs worker | grep -q "Task apps.notifications.tasks.send_notification"; then
            echo "worker consumed the task"
          else
            docker compose logs worker | tail -40
            echo "::error::the worker never received a notification task (async path broken)"
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 120

      - name: Tear down
        if: always()
        run: docker compose down -v